[settings]
  forward_agent = false
  clear_screen_on_connect = false
  broadcast_escape_enable = true
  broadcast_escape_char = "!"
  idle_timeout = "15m"
  keepalive_interval = "10s"
  log_level = "info"
  recent_limit = 7
  default_sftp_local_path = "~/fixture files"
  default_sync_provider = "cloud"
  sync_password = "ENC:u886KZycRGJA3OzgK9FXIDjW7ekR90tb5KJaPmL8uVU8+Yh964rrT2VjT5s4WVvEEw=="

[servers]
  [servers.srv_jump]
    id = "srv_jump"
    alias = "jump"
    host = "jump.example"
    port = 2222
    user = "fixture"
    auth_method = "agent"
  [servers.srv_legacy]
