name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - name: Full tests and native build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          ./scripts/test.sh 2>&1 | tee evidence/tests.log
          ./scripts/build.sh 2>&1 | tee evidence/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: |
            evidence/
            bin/knot-core*

  race:
    name: Linux race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - name: Resource and public protocol race tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          cd core
          GOWORK=off go test -race -count=1 -timeout=240s ./internal/resourcepolicy ./internal/api/http ./pkg/config ./pkg/session ./pkg/sftp ./pkg/sshpool ./pkg/core ./tests/integration ./examples/baseline 2>&1 | tee ../evidence/race.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-race
          path: evidence/

  cross-build:
    name: Six platform builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - name: Build Linux, macOS and Windows for amd64 and arm64
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          ./scripts/build.sh --all 2>&1 | tee evidence/cross-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-build
          path: |
            evidence/
            bin/knot-core-*

  lint:
    name: Go formatting and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - name: Lint with the pinned Go toolchain
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          ./scripts/lint.sh 2>&1 | tee evidence/lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint
          path: evidence/
