name: CI
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  DEV_VERSION: 0.1.0-dev

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            core/go.sum
            cli/go.sum
      - name: Full tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          (
            set -e
            for module in core cli; do
              (cd "$module" && GOWORK=off go test -count=1 -timeout=240s ./...)
            done
          ) 2>&1 | tee evidence/tests.log
      - name: Native build
        shell: bash
        env:
          BUILD_LOG: evidence/build.log
        run: &build_binaries |
          set -euo pipefail
          mkdir -p evidence bin
          (
            set -e
            VERSION="${VERSION:-$DEV_VERSION}"
            COMMIT="${COMMIT:-$(git rev-parse --short HEAD)}"
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
              COMMIT="$(git rev-parse HEAD)"
            fi
            BUILD_TIME="${BUILD_TIME:-$(date -u '+%Y-%m-%d_%H:%M:%S')}"
            DIRTY="${DIRTY:-$(if [[ -z "$(git status --porcelain)" ]]; then echo 'false'; else echo 'true'; fi)}"

            build_target() {
              local target_os="$1" target_arch="$2" target_name="$3" suffix=""
              if [[ "$target_os" == "windows" ]]; then suffix=".exe"; fi
              export GOWORK=off CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch"
              (
                cd core
                go build \
                  -ldflags="-s -w -X knot-core/pkg/core.DefaultVersion=$VERSION -X knot-core/pkg/core.BuildCommit=$COMMIT -X knot-core/pkg/core.BuildTime=$BUILD_TIME -X knot-core/pkg/core.BuildDirty=$DIRTY" \
                  -o "../bin/knot-core$target_name$suffix" ./cmd/core
              )
              (
                cd cli
                go build \
                  -ldflags="-s -w -X knot-cli/internal/buildinfo.Version=$VERSION -X knot-cli/internal/buildinfo.Commit=$COMMIT -X knot-cli/internal/buildinfo.BuildTime=$BUILD_TIME -X knot-cli/internal/buildinfo.Dirty=$DIRTY" \
                  -o "../bin/knot$target_name$suffix" .
              )
              echo "Built: bin/knot-core$target_name$suffix and bin/knot$target_name$suffix"
            }

            if [[ "${BUILD_ALL:-0}" == 1 ]]; then
              for target_os in linux darwin windows; do
                for target_arch in amd64 arm64; do
                  build_target "$target_os" "$target_arch" "-$target_os-$target_arch"
                done
              done
            else
              build_target "$(go env GOOS)" "$(go env GOARCH)" ""
            fi
          ) 2>&1 | tee "$BUILD_LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: |
            evidence/
            bin/knot*

  race:
    name: Linux race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            core/go.sum
            cli/go.sum
      - name: Resource and public protocol race tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd core
          GOWORK=off go test -race -count=1 -timeout=240s ./internal/resourcepolicy ./internal/api/http ./pkg/config ./pkg/session ./pkg/sftp ./pkg/sshpool ./pkg/core ./tests/integration ./examples/baseline 2>&1 | tee ../evidence/race.log
          cd ../cli
          GOWORK=off go test -race -count=1 -timeout=240s ./... 2>&1 | tee ../evidence/cli-race.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-race
          path: evidence/

  cross-build:
    name: Six platform builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            core/go.sum
            cli/go.sum
      - name: Build Linux, macOS and Windows for amd64 and arm64
        shell: bash
        env:
          BUILD_ALL: '1'
          BUILD_LOG: evidence/cross-build.log
        run: *build_binaries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-build
          path: |
            evidence/
            bin/knot-*
      - name: Prepare release assets
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          for target_os in linux darwin windows; do
            for target_arch in amd64 arm64; do
              target="$target_os-$target_arch"
              if [[ "$target_os" == windows ]]; then target="$target.exe"; fi
              cp "bin/knot-$target" "release-assets/knot-cli-$target"
              cp "bin/knot-core-$target" release-assets/
            done
          done
          cd release-assets
          sha256sum knot-cli-* knot-core-* > checksums.txt
          sha256sum -c checksums.txt
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  release-installers:
    name: Release installers (${{ matrix.os }})
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    needs: cross-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.ref_type == 'tag' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets/
      - name: Install and start the release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            # Use a fresh, unlocked keychain for the temporary runner account.
            keychain="$RUNNER_TEMP/knot-release.keychain-db"
            password="$(openssl rand -hex 24)"
            security create-keychain -p "$password" "$keychain"
            trap 'security delete-keychain "$keychain"' EXIT
            security list-keychains -d user -s "$keychain"
            security default-keychain -d user -s "$keychain"
            security unlock-keychain -p "$password" "$keychain"
          fi
          version_tag="$GITHUB_REF_NAME"
          commit="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            version_tag="v$DEV_VERSION"
            commit="$(git rev-parse --short HEAD)"
          fi
          python tests/integration/verify_release_installers.py "$version_tag" "$commit" --assets release-assets
          if [[ "$RUNNER_OS" == macOS ]]; then
            security find-generic-password -a knot-master-key -s knot -w "$keychain" |
              python -c 'import base64, sys; assert len(base64.b64decode(sys.stdin.buffer.read().strip(), validate=True)) == 32'
          fi

  lint:
    name: Go formatting and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            core/go.sum
            cli/go.sum
      - name: Lint with the pinned Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          (
            set -e
            go version
            for module in core cli; do
              (
                cd "$module"
                unformatted="$(gofmt -l .)"
                if [[ -n "$unformatted" ]]; then
                  echo "Go files requiring gofmt:" >&2
                  printf '%s\n' "$unformatted" >&2
                  exit 1
                fi
                GOWORK=off go vet ./...
              )
            done
          ) 2>&1 | tee evidence/lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint
          path: evidence/
